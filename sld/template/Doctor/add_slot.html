<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Consulting Schedule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <meta charset="utf-8">
    

    <!-- Favicon -->
    <link href="{% static 'img/favicon.ico' %}" rel="icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet"> 

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries -->
    <link href="{% static 'lib/animate/animate.min.css' %}" rel="stylesheet">
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">
    <link href="{% static 'lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css' %}" rel="stylesheet" />

    <!-- Bootstrap & Template CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
      padding: 20px;
    }
    .card {
      margin: auto;
      max-width: 900px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .form-select {
      min-width: 100px;
    }
  </style>
</head>
<body>
 <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white navbar-light sticky-top p-0">
        <a href="index.html" class="navbar-brand d-flex align-items-center px-4 px-lg-5">
            <h1 class="m-0 text-primary">SMART SLD</h1>
        </a>
        <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto p-4 p-lg-0">
                <a href="index.html" class="nav-item nav-link"></a>
                <a href="about.html" class="nav-item nav-link"></a>
                <a href="service.html" class="nav-item nav-link"></a>
                <a href="doctor/doctorlogin" class="nav-item nav-link"></a>
            </div>
            <a href="doctorhome" class="btn btn-primary rounded-0 py-4 px-lg-5 d-none d-lg-block">Home <i class="fa fa-arrow-left ms-3"></i></a>
        </div>
    </nav>
    <!-- Navbar End -->
  <div class="card">
    <div class="card-header text-center bg-primary text-white">
      <h4>Doctor Consulting Availability Form</h4>
    </div>
    <div class="card-body">
<form method="POST">
  {% csrf_token %}
        <table class="table table-bordered align-middle text-center">
          <thead class="table-light">
            <tr>
              <th>Day</th>
              <th>Available</th>
              <th>Start Time</th>
              <th>End Time</th>
            </tr>
          </thead>
          <tbody>
            <!-- Days of the Week -->
            <script>
              const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
              document.write(
                days.map(day => `
                <tr>
                  <td><strong>${day}</strong></td>
                  <td>
                    <input type="checkbox" name="days[]" value="${day}" class="form-check-input" onchange="toggleTime('${day}')">
                  </td>
                  <td>
                    <div class="d-flex justify-content-center gap-2">
                      <select name="${day.toLowerCase()}_start_hour" class="form-select time-input" disabled>
                        ${[...Array(12)].map((_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('')}
                      </select>
                      <select name="${day.toLowerCase()}_start_minute" class="form-select time-input" disabled>
                        <option value="00">00</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="45">45</option>
                      </select>
                      <select name="${day.toLowerCase()}_start_ampm" class="form-select time-input" disabled>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                      </select>
                    </div>
                  </td>
                  <td>
                    <div class="d-flex justify-content-center gap-2">
                      <select name="${day.toLowerCase()}_end_hour" class="form-select time-input" disabled>
                        ${[...Array(12)].map((_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('')}
                      </select>
                      <select name="${day.toLowerCase()}_end_minute" class="form-select time-input" disabled>
                        <option value="00">00</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="45">45</option>
                      </select>
                      <select name="${day.toLowerCase()}_end_ampm" class="form-select time-input" disabled>
                        <option value="AM">AM</option>
                        <option value="PM">PM</option>
                      </select>
                    </div>
                  </td>
                </tr>
              `).join('')
              );
            </script>
          </tbody>
        </table>
        <div class="text-center mt-4">
          <button type="submit" class="btn btn-success px-4">Submit Schedule</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script to enable/disable time fields -->
  <script>
    function toggleTime(day) {
      const inputs = document.querySelectorAll(`[name^="${day.toLowerCase()}_"]`);
      const isChecked = document.querySelector(`input[value="${day}"]`).checked;
      inputs.forEach(input => {
        if (!input.type || input.type !== 'checkbox') {
          input.disabled = !isChecked;
        }
      });
    }
  </script>

  <!-- Bootstrap JS (Optional, for interactivity) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
