<!DOCTYPE html>

<html lang="en">
  <head>

  <body>

      <nav class="sidebar-nav">
        <ul>
          <li class="nav-item nav-item-has-children">
            <a
              href="aadminhome" >

                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M8.74999 18.3333C12.2376 18.3333 15.1364 15.8128 15.7244 12.4941C15.8448 11.8143 15.2737 11.25 14.5833 11.25H9.99999C9.30966 11.25 8.74999 10.6903 8.74999 10V5.41666C8.74999 4.7263 8.18563 4.15512 7.50586 4.27556C4.18711 4.86357 1.66666 7.76243 1.66666 11.25C1.66666 15.162 4.83797 18.3333 8.74999 18.3333Z" />

    <!-- ======== main-wrapper start =========== -->
    <main class="main-wrapper">
      <!-- ========== header start ========== -->
      <header class="header">
        <div class="container-fluid">
          <div class="row">
            <div class="col-lg-5 col-md-5 col-6">
              <div class="header-left d-flex align-items-center">
                <div class="menu-toggle-btn mr-15">
                  <button id="menu-toggle" class="main-btn primary-btn btn-hover">
                    <i class="lni lni-chevron-left me-2"></i> Menu
                  </button>
                </div>
             
              </div>
            </div>
            <div class="col-lg-7 col-md-7 col-6">
              <div class="header-right">
                <!-- notification start -->
                
                <!-- notification end -->
                <!-- message start -->
                
                <!-- message end -->
                <!-- profile start -->
                <div class="profile-box ml-15">
                  <button class="dropdown-toggle bg-transparent border-0" type="button" id="profile"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="profile-info">
                      <div class="info">
                        <div class="image">
                          <img src="{% static 'P_admin/assets/images/profile/profile-image.png'%}" alt="" />
                        </div>
                        <div>
                          <h6 class="fw-500">Thejas</h6>
                          <p>Admin</p>
                        </div>
                      </div>
                    </div>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profile">
                    <li>
                      <div class="author-info flex items-center !p-1">
                        <div class="image">
                          <img src="{% static 'P_admin/assets/images/profile/profile-image.png'%}" alt="image">
                        </div>
                        <div class="content">
                          <h4 class="text-sm">User</h4>
                          <a class="text-black/40 dark:text-white/40 hover:text-black dark:hover:text-white text-xs"
                            href="#">Email@gmail.com</a>
                        </div>
                      </div>
                    </li>
                    
                    <li>
                      <a href="/"> <i class="lni lni-exit"></i> Sign Out </a>
                    </li>
                  </ul>
                </div>
                <!-- profile end -->
              </div>
            </div>
          </div>
        </div>
      </header>
      <!-- ========== header end ========== -->

      <!-- ========== table components start ========== -->
      <section class="table-components">
        <div class="container-fluid">
          <!-- ========== title-wrapper start ========== -->
          <div class="title-wrapper pt-30">
            <div class="row align-items-center">
              <div class="col-md-6">
                <div class="title">
                 
                </div>
              </div>
              <!-- end col -->
              <div class="col-md-6">
                <div class="breadcrumb-wrapper">
                  <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                      <li class="breadcrumb-item">
                        <a href="#0">Dashboard</a>
                      </li>
                      <li class="breadcrumb-item active" aria-current="page">
                    
                      </li>
                    </ol>
                  </nav>
                </div>
              </div>
              <!-- end col -->
            </div>
            <!-- end row -->
          </div>
          <!-- ========== title-wrapper end ========== -->

          <title>Form Page</title>

    <style>
        

        .form-container {
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #0077cc;
        }
        label {
            font-weight: bold;
            margin-bottom: 6px;
            display: block;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0077cc;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005fa3;
        }
    </style>
    <style>
        .center-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh; /* adjust depending on layout */
}
    </style>
</head>


<section class="table-components">
    <div class="container-fluid">
        <div class="center-wrapper">
            <div class="form-container">
                <h2>Enter Your Details</h2>
                <form method="post">
                    {% csrf_token %}
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" value="{{D.FirstName}}" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{D.Email}}" required>

                    <button type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
</section>



      <!-- ========== footer start =========== -->
               <!-- end row -->
        </div>
        <!-- end container -->
      </footer>
      <!-- ========== footer end =========== -->
    </main>
    <!-- ======== main-wrapper end =========== -->

    <!-- ========= All Javascript files linkup ======== -->
    <script src="{% static 'P_admin/assets/js/bootstrap.bundle.min.js'%}"></script>
    <script src="{% static 'P_admin/assets/js/Chart.min.js'%}"></script>
    <script src="{% static 'P_admin/assets/js/dynamic-pie-chart.js'%}"></script>
    <script src="{% static 'P_admin/assets/js/moment.min.js'%}"></script>
    <script src="{% static 'P_admin/assets/js/fullcalendar.js'%}"></script>
    <script src="{% static 'P_admin/assets/js/jvectormap.min.js'%}"></script>
    <script src="{% static 'P_admin/assets/js/world-merc.j'%}"></script>
    <script src="{% static 'P_admin/assets/js/polyfill.js'%}"></script>
    <script src="{% static 'P_admin/assets/js/main.js'%}"></script>
  </body>
</html>
